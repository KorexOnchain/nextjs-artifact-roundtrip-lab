name: artifact-roundtrip
on:
  workflow_dispatch:
  push:
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node mk.mjs
      - name: show what is on disk
        run: find art -name '*.tgz' -printf '%P\n'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-tarballs
          path: art/*
          if-no-files-found: error
  consume:
    needs: produce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-tarballs
          path: dl
      - name: where did everything land
        run: |
          echo "== dl tree:"; find dl -print 2>/dev/null | head -30
          echo "== every tgz under the workspace:"; find /home/runner/work -name '*.tgz' 2>/dev/null | head -30
          echo "== anything with a backslash:"; find /home/runner/work -name '*\\*' 2>/dev/null | head -30
          ls -la /home/runner/work/nextjs-artifact-roundtrip-lab 2>/dev/null
      - name: assert names survived
        run: node check.mjs
        continue-on-error: true
